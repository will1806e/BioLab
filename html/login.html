<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="../img/biolab_favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <header>
        <img src="../img/Logo-biolab.png" alt="BioLab Logo" width="200">   <!-- Logo deverá ser centralizada -->
        <hr>
    </header>
    <main>
        <h1>Bem-Vindo ao BioLab!</h1> <!--Centralizada em cima-->
        <h2>Faça seu login</h2>
        <p>Para continuar, entre com seu Login e Senha. Caso não tenha um cadastro, <a href="../html/cadastro.html">Faça o seu cadastro aqui.</a></p>

        <form action="" method="post">
            <div><label class="label-text" for="user">Nome de Usuário:</label>
            <input class="input-text" type="text" name="user" id="user" placeholder="Digite aqui..." required> </div>
            <!--Required ajuda a não passar em branco, mas é possivel burlar, reforçar no back-end-->
            <div><label class="label-text" for="user">Senha:</label>
            <input class="input-text" type="text" name="password" id="password" placeholder="Digite aqui..." required></div>
            <input class="enviar" type="submit" value="Enviar">
        </form>
    </main>
    <footer>
        <hr>
        <p>&copy; 2026 BioLab. Todos os direitos reservados.</p>   
    </footer>
</body>
</html>
