<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="../img/biolab_favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <img src="../img/Logo-biolab.png" alt="BioLab Logo">   <!-- Logo deverá ser centralizada -->
        <hr>
    </header>
    <main>
        <h1>Bem-Vindo ao BioLab!</h1> <!--Centralizada em cima-->
        <h2>Faça seu login</h2>
        <p>Para continuar, entre com seu Login e Senha. Caso não tenha um cadastro, <a href="../html/cadastro.html">Faça o seu cadastro aqui.</a></p>

        <form action="" method="post">
            <label for="user">Nome de Usuário:</label>
            <input type="text" name="user" id="user" placeholder="Digite aqui..." required>
            <label for="user">Senha:</label>
            <input type="text" name="password" id="password" placeholder="Digite aqui..." required>
            <input type="submit" value="Enviar">
        </form>
    </main>
    <footer>
        <hr>
        <p>&copy; 2026 BioLab. Todos os direitos reservados.</p>   
    </footer>
</body>
</html>
